name: TFT Meta Watcher

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 python-dotenv

      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state/tft_meta_state.json
          key: tft-state-${{ github.run_number }}
          restore-keys: |
            tft-state-

      - name: 메타 감시 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tft_meta_watcher.py

      - name: 상태 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/tft_meta_state.json
          key: tft-state-${{ github.run_number }}

      - name: GitHub Pages 배포
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "update dashboard"
