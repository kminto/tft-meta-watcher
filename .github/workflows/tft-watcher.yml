name: TFT Meta Watcher

on:
  schedule:
    # 30분마다 실행 (UTC 기준, KST = UTC+9)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 python-dotenv

      # 이전 상태 파일 복원 (캐시)
      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state/tft_meta_state.json
          key: tft-state-${{ github.run_number }}
          restore-keys: |
            tft-state-

      - name: 메타 감시 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tft_meta_watcher.py

      # 상태 파일 저장 (다음 실행에서 비교용)
      - name: 상태 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/tft_meta_state.json
          key: tft-state-${{ github.run_number }}
